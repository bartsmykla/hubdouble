                          exit 1
                        fi
                run:
                  needs:
                    - gate
                    - stage
                  if: ${{ !cancelled() && needs.gate.result == 'success' && needs.stage.outputs.claimed != 'true' }}
                  runs-on: ${{ startsWith(needs.gate.outputs.runs_on, '[') && fromJSON(needs.gate.outputs.runs_on) ||
                    needs.gate.outputs.runs_on }}
                  timeout-minutes: ${{ fromJSON(needs.gate.outputs.stage_job_minutes || needs.gate.outputs.job_timeout_minutes) }}
                  environment: ${{ vars.AGENT_JOB_ENVIRONMENT }}
                  env:
                    AGENT_MODEL_AUTH_MODE: ${{ needs.gate.outputs.model_auth_mode }}
                    AGENT_REVIEW_ADMISSION: ${{ needs.gate.outputs.review_admission }}
                  permissions:
                    contents: read
                    id-token: write
                  steps:
                    - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
                      with:
                        egress-policy: block
                        allowed-endpoints: api.github.com:443 github.com:443 *.githubusercontent.com:443 *.actions.githubusercontent.com:443
                          *.blob.core.windows.net:443 ingress.us-west-2.aws.dash0.com:443 archive.ubuntu.com:80 azure.archive.ubuntu.com:80
                          security.ubuntu.com:80 registry.npmjs.org:443 registry.yarnpkg.com:443 nodejs.org:443 proxy.golang.org:443 sum.golang.org:443
                          storage.googleapis.com:443 pypi.org:443 files.pythonhosted.org:443 crates.io:443 index.crates.io:443
                          static.crates.io:443 tuf-repo-cdn.sigstore.dev:443 tuf-repo.github.com:443 ${{ needs.gate.outputs.egress_endpoints }} ${{ needs.gate.outputs.gateway }} ${{
                          needs.gate.outputs.endpoint }}
                        disable-telemetry: true
                    - name: Mint agent read token
                      id: agent-token
                      continue-on-error: true
                      uses: octo-org/runner/.github/actions/run-token@40288d059d45156f234653fcb8a523ad5fc7eb6d  # v5.1.0
                      with:
                        grant: source
                        endpoint: https://client.example.com
                    - name: Mint this repository's read token
                      id: authz-token
                      uses: octo-org/runner/.github/actions/run-token@40288d059d45156f234653fcb8a523ad5fc7eb6d  # v5.1.0
                      with:
                        grant: read
                        endpoint: https://client.example.com
                    - name: Read this run's credentials
                      id: credentials
                      uses: octo-org/runner/.github/actions/run-credentials@40288d059d45156f234653fcb8a523ad5fc7eb6d  # v5.1.0
                      with:
                        endpoint: https://client.example.com
                    - name: Check out the revision the package stage reads
                      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                      with:
                        ref: ${{ needs.gate.outputs.source_revision }}
                        token: ${{ steps.authz-token.outputs.token }}
                        persist-credentials: false
                    - uses: octo-org/runner/.github/actions/agent@40288d059d45156f234653fcb8a523ad5fc7eb6d  # v5.1.0
                      env:
                        AGENT_PROVIDER_OBSERVATIONS: "true"
                      with:
                        source_org_github_token: ${{ steps.authz-token.outputs.token }}
                        org_github_token: ${{ steps.agent-token.outputs.token }}
                        artifact_retention_days: 14
                        job_timeout_minutes: ${{ needs.gate.outputs.stage_minutes || needs.gate.outputs.job_timeout_minutes }}
                        max_consecutive_tool_failures: ${{ needs.gate.outputs.max_consecutive_tool_failures }}
                        max_repeated_tool_calls: ${{ needs.gate.outputs.max_repeated_tool_calls }}
                        otel_endpoint: https://ingress.us-west-2.aws.dash0.com
                        otel_headers: ${{ steps.credentials.outputs.otel_headers }}
                        denied_paths: ${{ needs.gate.outputs.denied_paths }}
                        control_plane_endpoint: https://client.example.com
                        record_id: ${{ needs.gate.outputs.record_id }}
                        opencode_version: ${{ needs.gate.outputs.opencode_version }}
                        anthropic_base_url: ${{ needs.gate.outputs.model_gateway_url }}
                        npm_token: ${{ secrets.npm_token }}
                  name: Package stage
            .github/runtime-capabilities.json: |
              {
                "version": 1,
                "capabilities": {
                  "core_review": {
                    "stage": "client.example.com/stage-request/v1alpha1",
                    "source": "core-review-context/v1",
                    "candidate": "client.example.com/core-review-candidate/v1alpha1",
                    "result": "client.example.com/core-review-audit/v1alpha1",
                    "answers": "client.example.com/stage-candidate/v1alpha1"
                  },
                  "implement": {
                    "stage": "client.example.com/stage-request/v1alpha1",
                    "changeset": "client.example.com/stage-changeset/v1alpha1"
                  },
                  "stage_steps": {
                    "contract": "client.example.com/stage-steps/v2"
                  }
                }
              }
          tags:
            - name: v5.1.0
              message: AGENT Runtime v5.1.0
        - message: Add the runtime release catalog
          files:
            .github/releases.json: |
              {
                "releases": [
                  {"tag": "v5.0.6", "commit": "{{sha "octo-org/runner" "v5.0.6"}}"},
                  {"tag": "v5.1.0", "commit": "{{sha "octo-org/runner" "v5.1.0"}}"}
                ]
              }

    - kind: repository
      owner: octo-org
      name: e2e
      visibility: private
      default_branch: main
      collaborators:
        - login: local-user
          permission: write
      files:
        .github/workflows/agent.yml: |
          ---
          name: AGENT

          permissions: {}

          on:  # yamllint disable-line rule:truthy
            workflow_dispatch: {}

          jobs:
            agent:
              name: run
              uses: octo-org/runner/.github/workflows/agent.yml@{{sha "octo-org/runner" "v5.1.0"}}  # v5.1.0
              permissions:
                contents: read   # checked out by every command; a push uses the token CP mints
                id-token: write  # mint the GitHub OIDC token for the octo-org gateway
        README.md: |
          # AGENT local end-to-end test
      commits:
        - branch: add-review-guide
          message: Add the review guide
          author:
            name: AGENT Local User
            email: local-user@example.com
          files:
            guide.md: |
              # Review guide

              Add a `/agent review` comment to an open pull request.

    - kind: app
      id: 1000001
      slug: agent-local
      owner: octo-org
      public_key: '{{env "HUBDOUBLE_APP_PUBLIC_KEY"}}'
      webhook:
        url: '{{env "HUBDOUBLE_APP_WEBHOOK_URL"}}'
        secret: '{{env "HUBDOUBLE_APP_WEBHOOK_SECRET"}}'
      events: [issue_comment]
      permissions:
          actions: write
          actions_variables: read
          checks: write
          contents: write
          issues: write
          members: read
          metadata: read
          organization_self_hosted_runners: read
          pull_requests: write
          statuses: write
          workflows: write

    - kind: installation
      id: 962416
      app: agent-local
      account: octo-org
      repository_selection: selected
      repositories: [app, runner, e2e]
      permissions:
          actions: write
          actions_variables: read
          checks: write
          contents: write
          issues: write
          members: read
          metadata: read
          organization_self_hosted_runners: read
          pull_requests: write
          statuses: write
          workflows: write

    - kind: pull_request
      repository: octo-org/e2e
      user: local-user
      title: Add the review guide
      head: add-review-guide
      base: main

    - kind: actions
      auto_complete: none

    - kind: actions_variable
      repository: octo-org/e2e
      name: AGENT_TRIGGER_PHRASE
      value: ""

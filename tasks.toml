[fmt]
description = "Format every crate"
run = "cargo fmt --all"

[lint]
description = "Check formatting, Clippy with warnings as errors, and cargo-deny"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo deny --locked check",
]

[test]
description = "Run every test with nextest, then the doc tests"
run = [
  "cargo nextest run --workspace --locked --no-tests=pass",
  "cargo test --workspace --locked --doc",
]

[check]
description = "Everything CI checks: lint, tests and doc tests"
depends = ["lint", "test"]

[build]
description = "Build the release binary"
run = "cargo build --release --locked -p hubdouble"

[bench]
description = "Run the criterion benchmarks and measure every target of plan section 9"
run = "cargo bench --workspace --locked"

["bench:targets"]
description = "Measure every row of plan section 9 on the release profile on one CPU; fails on a miss"
run = "cargo bench --locked -p hubdouble --bench targets"

["bench:gate"]
description = "Compare the five paired base-N.json and head-N.json rounds in HUBDOUBLE_BENCH_ROUNDS and criterion's base-N and head-N baselines of the benches in target/criterion/expected-base.txt and expected-head.txt; fails on a regression over 20 %, a missed target or missing data"
run = "cargo bench --locked -p hubdouble --bench targets -- --gate"

[gen]
description = "Generate crates/spec/src/ops_gen.rs from the pinned OpenAPI bundle and spec/graphql/schema.graphql from the GraphQL pins"
run = "cargo run --locked -p xtask -- gen"

["graphql:pin"]
description = "Read live GET /graphql and one introspection POST with GITHUB_TOKEN or GH_TOKEN, rewrite the GraphQL pins in spec/graphql and regenerate the schema"
run = "cargo run --locked -p xtask -- graphql-pin"

["coverage:ratchet"]
description = "Fail when an operation that docs/coverage.txt registers at the given base revision is missing now"
run = "cargo run --locked -p xtask -- coverage-ratchet"

[inventory]
description = "Generate the client's API inventory"
run = "cargo run --locked -p xtask -- inventory"

["inventory:check"]
description = "Check the client's API inventory for changes"
run = "cargo run --locked -p xtask -- inventory --check"

["smoke:kind"]
description = "Build the Docker image and test it in a disposable kind cluster"
run = "cargo run --locked -p xtask -- smoke-kind"

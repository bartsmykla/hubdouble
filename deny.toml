[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin Attack timing side channel in rsa 0.9, reached only through pgp. hubdouble is a local test double: it signs with a fixed, public Ed25519 test key, never with RSA, and holds no secret an attacker can time" },
    { id = "RUSTSEC-2026-0387", reason = "Non-constant-time operations in crypto-bigint 0.5, reached only through pgp's cx448. hubdouble is a local test double: it signs with a fixed, public Ed25519 test key, never with X448, and holds no secret an attacker can time" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["GPL-2.0-only WITH GCC-exception-2.0"], crate = "libgit2-sys" },
]

[[licenses.clarify]]
crate = "libgit2-sys"
expression = "(MIT OR Apache-2.0) AND GPL-2.0-only WITH GCC-exception-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

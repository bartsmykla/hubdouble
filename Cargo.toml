[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
repository = "https://github.com/bartsmykla/hubdouble"
publish = false

[workspace.dependencies]
hubdouble-admin = { path = "crates/admin" }
hubdouble-api = { path = "crates/api" }
hubdouble-api-actions = { path = "crates/api-actions" }
hubdouble-api-apps = { path = "crates/api-apps" }
hubdouble-api-checks = { path = "crates/api-checks" }
hubdouble-api-gitdata = { path = "crates/api-gitdata" }
hubdouble-api-issues = { path = "crates/api-issues" }
hubdouble-api-orgs = { path = "crates/api-orgs" }
hubdouble-api-pulls = { path = "crates/api-pulls" }
hubdouble-api-repos = { path = "crates/api-repos" }
hubdouble-api-reviews = { path = "crates/api-reviews" }
hubdouble-api-search = { path = "crates/api-search" }
hubdouble-api-users = { path = "crates/api-users" }
hubdouble-auth = { path = "crates/auth" }
hubdouble-git = { path = "crates/git" }
hubdouble-gql = { path = "crates/gql" }
hubdouble-hooks = { path = "crates/hooks" }
hubdouble-model = { path = "crates/model" }
hubdouble-render = { path = "crates/render" }
hubdouble-rest = { path = "crates/rest" }
hubdouble-server = { path = "crates/server" }
hubdouble-spec = { path = "crates/spec" }
hubdouble-store = { path = "crates/store" }

apollo-compiler = "=1.33.1"
base64 = "=0.23.1"
bytes = "=1.12.2"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
gix-hash = "=0.28.1"
gix-object = "=0.66.1"
hmac = "=0.13.0"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.21", features = ["http1", "http2", "server", "server-auto", "server-graceful", "service", "tokio"] }
imara-diff = "=0.2.0"
jsonschema = { version = "=0.62.0", default-features = false }
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
mimalloc = "=0.1.52"
parking_lot = "=0.13.0"
percent-encoding = "=2.3.2"
pgp = "=0.21.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
rsa = "=0.10.0"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde-saphyr = "=2.2.0"
serde_json = "=1.0.154"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "=1.29.3", features = ["v4"] }

[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
print_stdout = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "fat"
panic = "unwind"

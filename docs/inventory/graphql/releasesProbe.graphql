query($owner: String!, $name: String!, $branch: String!) {
  repository(owner: $owner, name: $name) {
    refs(refPrefix: "refs/tags/agent/", first: 1, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {
      totalCount
      nodes { name target { oid } }
    }
    main: ref(qualifiedName: $branch) { target { oid } }
  }
}

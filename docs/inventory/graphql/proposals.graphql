query($owner: String!, $name: String!, $query: String!, $first: Int!) {
  search(query: $query, type: ISSUE, first: $first) {
    nodes { ...proposal }
  }
  repository(owner: $owner, name: $name) {
    refs(refPrefix: "refs/heads/prompts/", query: "proposal-", first: $first, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {
      nodes { associatedPullRequests(first: 1, orderBy: {field: UPDATED_AT, direction: DESC}) { nodes { ...proposal } } }
    }
  }
}

fragment proposal on PullRequest {
  number title url state isDraft updatedAt mergedAt
  headRefName headRepository { nameWithOwner } body reviewDecision
  mergeCommit { oid }
  commits(last: 1) { nodes { commit { statusCheckRollup { state } } } }
}

name: bench

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
  ROUNDS: 5

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: the runner, the base and the head
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Hypervisor vendor):'
          {
            echo "HEAD_SHA=$(git rev-parse HEAD)"
            echo "BASE_SHA=$(git rev-parse "$BASE_REF")"
            echo "CRITERION_HOME=$GITHUB_WORKSPACE/target/criterion"
          } >> "$GITHUB_ENV"
          rm -rf target/criterion
      - name: build the benchmarks and the image of the base and the head
        run: |
          for side in base head; do
            if [ "$side" = base ]; then sha=$BASE_SHA; else sha=$HEAD_SHA; fi
            git checkout -q --detach "$sha"
            mkdir -p "$RUNNER_TEMP/$side"
            cargo bench --workspace --bench '*' --locked --no-run --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .executable != null
                        and (.target.kind | index("bench"))) | "\(.target.name) \(.executable)"' \
              | while read -r name exe; do cp "$exe" "$RUNNER_TEMP/$side/$name"; done
            test -x "$RUNNER_TEMP/$side/targets"
            docker build -q -t "hubdouble:bench-$side" .
          done
      - name: criterion benchmarks, base and head rounds interleaved
        run: |
          for exe in "$RUNNER_TEMP"/head/*; do
            name=$(basename "$exe")
            [ "$name" = targets ] && continue
            for round in $(seq 1 "$ROUNDS"); do
              order="base head"
              if [ $((round % 2)) -eq 0 ]; then order="head base"; fi
              for side in $order; do
                if [ -x "$RUNNER_TEMP/$side/$name" ]; then
                  "$RUNNER_TEMP/$side/$name" --bench --warm-up-time 1 --measurement-time 1 \
                    --save-baseline "$side-$round"
                fi
              done
            done
          done
      - name: plan section 9 targets, base and head rounds interleaved
        run: |
          dir="$RUNNER_TEMP/rounds"
          mkdir -p "$dir"
          for round in $(seq 1 "$ROUNDS"); do
            order="base head"
            if [ $((round % 2)) -eq 0 ]; then order="head base"; fi
            for side in $order; do
              if [ "$side" = base ]; then sha=$BASE_SHA; else sha=$HEAD_SHA; fi
              git checkout -q --detach "$sha"
              echo "::group::round $round, $side"
              HUBDOUBLE_BENCH_IMAGE="hubdouble:bench-$side" \
                HUBDOUBLE_BENCH_OUT="$dir/$side-$round.json" \
                "$RUNNER_TEMP/$side/targets" || true
              echo "::endgroup::"
              if [ ! -f "$dir/$side-$round.json" ]; then
                echo "::error::round $round of the $side wrote no report"
                exit 1
              fi
            done
          done
          git checkout -q --detach "$HEAD_SHA"
      - name: the gate against the base and the targets
        run: HUBDOUBLE_BENCH_ROUNDS="$RUNNER_TEMP/rounds" "$RUNNER_TEMP/head/targets" --gate
